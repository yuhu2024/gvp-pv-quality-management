{% extends "base.html" %}

{% block title %}培训签到二维码 - {{ course.title }}{% endblock %}

{% block extra_css %}
<style>
    .qrcode-container {
        max-width: 640px;
        margin: 0 auto;
        text-align: center;
    }

    .qrcode-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: #0d6efd;
        margin-bottom: 0.5rem;
    }

    .qrcode-course-name {
        font-size: 1.3rem;
        color: #333;
        margin-bottom: 1.5rem;
        word-break: break-all;
    }

    .qrcode-image-wrapper {
        display: inline-block;
        padding: 20px;
        background: #fff;
        border: 2px solid #e9ecef;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        margin-bottom: 1.5rem;
    }

    .qrcode-image-wrapper img {
        width: 360px;
        height: auto;
        max-width: 100%;
        display: block;
    }

    .qrcode-hint {
        font-size: 1.15rem;
        color: #198754;
        font-weight: 600;
        margin-bottom: 1rem;
    }

    .qrcode-url-box {
        background: #f8f9fa;
        border: 1px dashed #ced4da;
        border-radius: 8px;
        padding: 12px 16px;
        margin: 0 auto 1.5rem;
        max-width: 100%;
        word-break: break-all;
        font-size: 0.9rem;
        color: #6c757d;
    }

    .qrcode-actions .btn {
        font-size: 1.05rem;
        padding: 10px 28px;
    }
</style>
{% endblock %}

{% block content %}
<div class="qrcode-container my-4">
    <div class="qrcode-title">
        <i class="bi bi-qr-code"></i> 培训签到二维码
    </div>
    <div class="qrcode-course-name">{{ course.title }}</div>

    <div class="qrcode-image-wrapper">
        <img src="{% url 'signatures:qrcode_image' course.pk %}" alt="签到二维码" id="qrcodeImg">
    </div>

    <div class="qrcode-hint">
        <i class="bi bi-wechat"></i> 请学员使用微信扫描二维码进行签到
    </div>

    <div class="qrcode-url-box">
        <i class="bi bi-link-45deg"></i> 签到链接：<br>{{ checkin_url }}
    </div>

    <div class="qrcode-actions d-flex justify-content-center gap-3 flex-wrap">
        <button type="button" class="btn btn-outline-primary" onclick="refreshQrcode()">
            <i class="bi bi-arrow-clockwise"></i> 刷新二维码
        </button>
        <a href="{% url 'courses:detail' course.pk %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> 返回
        </a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function refreshQrcode() {
    var img = document.getElementById('qrcodeImg');
    // 添加时间戳防止浏览器缓存，强制重新加载二维码图片
    var baseUrl = img.src.split('?')[0];
    img.src = baseUrl + '?t=' + Date.now();
}
</script>
{% endblock %}
