{% extends "base.html" %}
{% block title %}确认删除 - {{ matrix.title }} - {{ SYSTEM_NAME }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center py-5">
                    <div class="mb-3" style="font-size: 3rem; color: #dc3545;">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </div>
                    <h5 class="mb-3">确认删除培训矩阵</h5>
                    <p>确定要删除「<strong>{{ matrix.title }}</strong>」吗？</p>
                    <p class="text-muted small">此操作不可恢复，所有关联的课程条目和用户进度数据将被删除。</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <a href="{% url 'training_matrix:detail' matrix.pk %}" class="btn btn-outline-secondary">取消</a>
                            <button type="submit" class="btn btn-danger">确认删除</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
