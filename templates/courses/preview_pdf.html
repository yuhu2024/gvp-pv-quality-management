{% extends "base.html" %}

{% block title %}预览 - {{ material.title }} - {{ SYSTEM_NAME }}{% endblock %}

{% block extra_css %}
<style>
    #pdf-viewer { width: 100%; height: 80vh; border: 1px solid #ddd; }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card mb-3">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="bi bi-file-earmark-pdf"></i> {{ material.title }}
                </h5>
                <div>
                    <a href="{% url 'courses:detail' course.pk %}" class="btn btn-sm btn-secondary">返回课程</a>
                    <a href="{% url 'courses:material_download' course.pk material.pk %}" class="btn btn-sm btn-primary">
                        <i class="bi bi-download"></i> 下载
                    </a>
                </div>
            </div>
        </div>

        <iframe id="pdf-viewer" src="{{ pdf_url }}" frameborder="0"></iframe>
    </div>
</div>
{% endblock %}
