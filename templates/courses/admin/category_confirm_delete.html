{% extends "base.html" %}

{% block title %}删除分类 - {{ SYSTEM_NAME }}{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'courses:admin_dashboard' %}">管理中心</a></li>
                <li class="breadcrumb-item"><a href="{% url 'courses:admin_category_list' %}">课程分类管理</a></li>
                <li class="breadcrumb-item active">删除分类</li>
            </ol>
        </nav>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">
                    <i class="bi bi-exclamation-triangle"></i> 确认删除
                </h5>
            </div>
            <div class="card-body text-center py-4">
                <i class="bi bi-trash text-danger" style="font-size: 3rem;"></i>
                <h5 class="mt-3">确定要删除分类「{{ object.name }}」吗？</h5>
                <p class="text-muted">
                    删除后将无法恢复，请谨慎操作。
                </p>
                {% if object.code %}
                <p class="text-muted small">
                    编码：<code>{{ object.code }}</code>
                </p>
                {% endif %}
            </div>
            <div class="card-footer">
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'courses:admin_category_list' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg"></i> 取消
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> 确认删除
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
