{% extends "base.html" %}

{% block title %}上传资料 - {{ course.title }} - {{ SYSTEM_NAME }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header">
                <h4 class="mb-0">
                    <i class="bi bi-upload"></i> 上传课程资料
                    <small class="text-muted">- {{ course.title }}</small>
                </h4>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="title" class="form-label">资料标题</label>
                        <input type="text" name="title" class="form-control" placeholder="留空将使用文件名">
                    </div>
                    <div class="mb-3">
                        <label for="file_type" class="form-label">资料类型</label>
                        <select name="file_type" class="form-select">
                            {% for value, label in file_type_choices %}
                            <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="file" class="form-label">选择文件 <span class="text-danger">*</span></label>
                        <input type="file" name="file" class="form-control" required>
                        <small class="text-muted">支持PPT、Word、PDF、视频等格式，最大100MB</small>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">资料描述</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="可选，描述此资料的内容"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-upload"></i> 上传
                        </button>
                        <a href="{% url 'courses:detail' course.pk %}" class="btn btn-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
