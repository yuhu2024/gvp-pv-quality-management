{% extends "base.html" %}

{% block title %}创建课程 - {{ SYSTEM_NAME }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header">
                <h4 class="mb-0">
                    <i class="bi bi-plus-circle"></i> 创建课程
                </h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="title" class="form-label">课程标题 <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" required placeholder="请输入课程标题">
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">课程分类</label>
                        <select name="category" class="form-select">
                            <option value="">请选择分类</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">课程描述</label>
                        <textarea name="description" class="form-control" rows="5" placeholder="请输入课程描述"></textarea>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_published" class="form-check-input" id="is_published">
                        <label for="is_published" class="form-check-label">立即发布</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> 创建
                        </button>
                        <a href="{% url 'courses:list' %}" class="btn btn-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
