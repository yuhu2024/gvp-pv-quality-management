{% extends "base.html" %}

{% block title %}预览 - {{ material.title }} - {{ SYSTEM_NAME }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="card">
            <div class="card-body p-5">
                <i class="bi bi-file-earmark-x" style="font-size: 4rem; color: #6c757d;"></i>
                <h4 class="mt-3">暂不支持在线预览</h4>
                <p class="text-muted">该文件类型（{{ file_type }}）暂不支持在线预览，请下载后查看。</p>
                <div class="mt-3">
                    <a href="{% url 'courses:material_download' course.pk material.pk %}" class="btn btn-primary">
                        <i class="bi bi-download"></i> 下载文件
                    </a>
                    <a href="{% url 'courses:detail' course.pk %}" class="btn btn-secondary">返回课程</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
