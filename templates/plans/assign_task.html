{% extends "base.html" %}

{% block title %}分配任务 - {{ SYSTEM_NAME }}{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'plans:list' %}">培训计划</a></li>
                <li class="breadcrumb-item"><a href="{% url 'plans:detail' plan.pk %}">{{ plan.title }}</a></li>
                <li class="breadcrumb-item active">分配任务</li>
            </ol>
        </nav>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card shadow-sm">
            <div class="card-header">
                <h4 class="mb-0">
                    <i class="bi bi-person-plus"></i> 分配任务 - {{ plan.title }}
                </h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <!-- 选择任务 -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">选择要分配的任务 <span class="text-danger">*</span></label>
                        <select name="task_id" class="form-select" id="taskSelect" required>
                            <option value="">-- 请选择任务 --</option>
                            {% for task in tasks %}
                            <option value="{{ task.id }}">{{ task.title }} ({{ task.get_task_type_display }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- 选择用户 -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label fw-bold mb-0">选择用户 <span class="text-danger">*</span></label>
                            <div>
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="selectAllUsers()">全选</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="deselectAllUsers()">取消全选</button>
                            </div>
                        </div>
                        <div class="row border rounded p-2" style="max-height: 400px; overflow-y: auto;">
                            {% for user in users %}
                            <div class="col-md-3 col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="users" value="{{ user.id }}" id="user_{{ user.id }}">
                                    <label class="form-check-label" for="user_{{ user.id }}">
                                        {{ user }}
                                    </label>
                                </div>
                            </div>
                            {% empty %}
                            <div class="col-12 text-muted p-3">暂无可分配的用户。</div>
                            {% endfor %}
                        </div>
                    </div>

                    <hr>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> 确认分配
                        </button>
                        <a href="{% url 'plans:detail' plan.pk %}" class="btn btn-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function selectAllUsers() {
    document.querySelectorAll('input[name="users"]').forEach(function(cb) {
        cb.checked = true;
    });
}

function deselectAllUsers() {
    document.querySelectorAll('input[name="users"]').forEach(function(cb) {
        cb.checked = false;
    });
}
</script>
{% endblock %}
