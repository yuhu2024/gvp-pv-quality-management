{% extends "base.html" %}

{% block title %}导入题目 - 题库管理{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-upload"></i> 批量导入题目</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> <strong>导入格式说明</strong>
                    <p class="mb-0 mt-1">请使用 Excel (.xlsx) 格式，表头必须包含以下列：<br>
                    <strong>题目内容 | 题目类型 | 选项A | 选项B | 选项C | 选项D | 正确答案 | 答案解析 | 分值 | 难度 | 知识点 | 标签</strong><br>
                    <small class="text-muted">题目类型：单选题/多选题/判断题/填空题/简答题<br>难度：简单/中等/困难</small></p>
                </div>

                <div class="mb-4">
                    <a href="{% url 'question_bank:export' %}" class="btn btn-outline-success">
                        <i class="bi bi-download"></i> 先导出模板（含表头）
                    </a>
                </div>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">选择 Excel 文件</label>
                        <input type="file" name="file" class="form-control" accept=".xlsx" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-upload"></i> 开始导入
                        </button>
                        <a href="{% url 'question_bank:list' %}" class="btn btn-secondary">返回题库</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
