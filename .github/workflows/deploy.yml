# ==============================================================
# 君合盟药物警戒培训管理系统 - GitHub Actions CI/CD 配置
# 支持自动测试、构建和部署到生产服务器
# ==============================================================

name: 部署君合盟药物警戒培训管理系统

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 运行测试
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: training_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django coverage

      - name: 运行 Django 系统检查
        run: python manage.py check --settings=training_system.settings
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: training_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432

      - name: 运行数据库迁移
        run: python manage.py migrate --noinput
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: training_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432

      - name: 运行测试
        run: |
          python manage.py test apps.users apps.courses apps.exams apps.plans apps.logs --noinput
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: training_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432

  deploy:
    name: 部署到生产服务器
    needs: test
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 部署到服务器（SSH）
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /opt/training_system
            
            # 备份数据库
            bash deploy/backup.sh
            
            # 拉取最新代码
            git pull origin main
            
            # 激活虚拟环境
            source venv/bin/activate
            
            # 安装依赖
            pip install -r requirements.txt --quiet
            
            # 收集静态文件
            python manage.py collectstatic --noinput --clear
            
            # 执行数据库迁移
            python manage.py migrate --noinput
            
            # 重启应用
            supervisorctl restart training_system
            
            echo "✅ 部署完成！"