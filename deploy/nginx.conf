# ==============================================================
# 君合盟药物警戒培训管理系统 - Nginx 配置（Docker Compose 版）
# 域名: db8mcom.cn
# ==============================================================

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name db8mcom.cn www.db8mcom.cn;

    # Let's Encrypt ACME 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务器
server {
    listen 443 ssl http2;
    server_name db8mcom.cn www.db8mcom.cn;

    # ===== SSL 证书（Let's Encrypt） =====
    ssl_certificate     /etc/letsencrypt/live/db8mcom.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db8mcom.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===== 安全头 =====
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ===== 文件上传大小限制（最大200MB） =====
    client_max_body_size 200M;
    client_body_buffer_size 128k;
    client_body_timeout 300s;
    proxy_read_timeout 300s;

    # ===== 静态文件 =====
    location /static/ {
        alias /var/www/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable, no-transform";
        access_log off;
    }

    # ===== 上传文件 =====
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== 动态请求（转发到 Django） =====
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 120s;
    }

    # ===== 安全：禁止访问隐藏文件和敏感文件 =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|pyc|sqlite3|md|log|bak|swp)$ {
        deny all;
        return 404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}