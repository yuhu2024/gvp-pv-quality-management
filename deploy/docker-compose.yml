# ==============================================================
# 君合盟药物警戒培训管理系统 - Docker Compose 生产环境配置
# 域名: db8mcom.cn
# 服务器: 120.27.196.230
#
# 启动:   docker compose up -d
# 停止:   docker compose down
# 日志:   docker compose logs -f
# 重启:   docker compose restart web
# ==============================================================

version: '3.8'

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: training_db
      POSTGRES_USER: training_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD 环境变量}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training_user -d training_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Django 应用
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ../logs:/app/logs
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?请设置 DJANGO_SECRET_KEY 环境变量}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "db8mcom.cn,www.db8mcom.cn,120.27.196.230"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: training_db
      DB_USER: training_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      STATIC_ROOT: /app/staticfiles
      MEDIA_ROOT: /app/media
      REDIS_URL: redis://redis:6379/1
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      SECURE_SSL_REDIRECT: "True"
      CSRF_TRUSTED_ORIGINS: "https://db8mcom.cn,https://www.db8mcom.cn"
      SECURE_HSTS_SECONDS: "31536000"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
      SECURE_HSTS_PRELOAD: "True"
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py create_permissions 2>/dev/null || true &&
        python manage.py init_data 2>/dev/null || true &&
        python manage.py collectstatic --noinput --clear &&
        gunicorn training_system.wsgi:application
          --bind 0.0.0.0:8000
          --workers 4
          --timeout 120
          --access-logfile -
          --error-logfile -
      "

  # Nginx 反向代理
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/staticfiles:ro
      - media_volume:/var/www/media:ro
      - certbot_www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_www: