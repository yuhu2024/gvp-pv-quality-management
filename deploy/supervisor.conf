; ==============================================================
; 君合盟药物警戒培训管理系统 - Supervisor 进程管理配置
; 安装: sudo ln -sf /etc/supervisor/conf.d/training_system.conf
; 重载: sudo supervisorctl reread && sudo supervisorctl update
; 管理: sudo supervisorctl {start|stop|restart|status} training_system
; ==============================================================

[program:training_system]
; Gunicorn 启动命令
command=/opt/training_system/venv/bin/gunicorn training_system.wsgi:application \
    --workers 4 \
    --worker-class sync \
    --bind unix:/tmp/training_system.sock \
    --timeout 120 \
    --max-requests 1000 \
    --max-requests-jitter 50 \
    --access-logfile /var/log/training_system/access.log \
    --access-logformat '%(h)s %(l)s %(u)s %(t)s "%(r)s" %(s)s %(b)s "%(f)s" "%(a)s" %(L)s' \
    --error-logfile /var/log/training_system/error.log \
    --log-level info

; 项目路径
directory=/opt/training_system

; 运行用户
user=www-data

; 自动启动和重启
autostart=true
autorestart=true

; 停止方式
stopasgroup=true
killasgroup=true

; 日志输出
stdout_logfile=/var/log/training_system/supervisor_stdout.log
stderr_logfile=/var/log/training_system/supervisor_stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_backups=3

; 环境变量（从 .env 自动加载）
environment=
    DJANGO_SETTINGS_MODULE="training_system.settings",
    PYTHONPATH="/opt/training_system",
    DJANGO_SECRET_KEY="%(ENV_DJANGO_SECRET_KEY)s",
    DJANGO_DEBUG="%(ENV_DJANGO_DEBUG)s",
    DJANGO_ALLOWED_HOSTS="%(ENV_DJANGO_ALLOWED_HOSTS)s",
    DB_ENGINE="%(ENV_DB_ENGINE)s",
    DB_NAME="%(ENV_DB_NAME)s",
    DB_USER="%(ENV_DB_USER)s",
    DB_PASSWORD="%(ENV_DB_PASSWORD)s",
    DB_HOST="%(ENV_DB_HOST)s",
    DB_PORT="%(ENV_DB_PORT)s",
    STATIC_ROOT="%(ENV_STATIC_ROOT)s",
    MEDIA_ROOT="%(ENV_MEDIA_ROOT)s",
    SESSION_COOKIE_SECURE="%(ENV_SESSION_COOKIE_SECURE)s",
    CSRF_COOKIE_SECURE="%(ENV_CSRF_COOKIE_SECURE)s",
    SECURE_SSL_REDIRECT="%(ENV_SECURE_SSL_REDIRECT)s"